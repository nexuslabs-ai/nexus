<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Nexus Design System — Press kit</title
  ><style>
    body {
      margin: 0;
      padding: 32px;
      background: #e8e8e5;
      color: #171717;
      font: 16px/1.5 sans-serif;
    }
    main {
      max-width: 1100px;
      margin: auto;
    }
    .pair {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      gap: 20px;
    }
    article {
      padding: 24px;
      background: #fff;
      border-radius: 12px;
    }
    .dark {
      background: #171717;
      color: #fafafa;
    }
    .large {
      width: 100%;
      margin: 40px 0;
    }
    .header {
      width: 300px;
      max-width: 100%;
      display: block;
    }
    .icon {
      width: 128px;
      height: 128px;
    }
    a {
      color: inherit;
    }
  </style>
  <main>
    <h1>nx: / Nexus Design System</h1>
    <p>JetBrains Mono code-block identity · October 2026</p>
    <div class="pair">
      <article class="light">
        <h2>Light</h2>
        <img
          class="large"
          src="svg/nx-logo-light.svg"
          alt="nx: Nexus Design System"
        /><img
          class="header"
          src="svg/nx-logo-light.svg"
          alt="Full lockup at header size"
        />
        <p>Compact favicon and app icon</p>
        <img class="icon" src="svg/nx-icon-light.svg" alt="nx: icon" />
        <p>
          <img
            src="png/nx-icon-light-16.png"
            width="16"
            height="16"
            alt="16px icon"
          />
          <img
            src="png/nx-icon-light-24.png"
            width="24"
            height="24"
            alt="24px icon"
          />
          <img
            src="png/nx-icon-light-32.png"
            width="32"
            height="32"
            alt="32px icon"
          />
          <img
            src="png/nx-icon-light-48.png"
            width="48"
            height="48"
            alt="48px icon"
          />
        </p>
      </article>
      <article class="dark">
        <h2>Dark</h2>
        <img
          class="large"
          src="svg/nx-logo-dark.svg"
          alt="nx: Nexus Design System"
        /><img
          class="header"
          src="svg/nx-logo-dark.svg"
          alt="Full lockup at header size"
        />
        <p>Compact favicon and app icon</p>
        <img class="icon" src="svg/nx-icon-dark.svg" alt="nx: icon" />
        <p>
          <img
            src="png/nx-icon-dark-16.png"
            width="16"
            height="16"
            alt="16px icon"
          />
          <img
            src="png/nx-icon-dark-24.png"
            width="24"
            height="24"
            alt="24px icon"
          />
          <img
            src="png/nx-icon-dark-32.png"
            width="32"
            height="32"
            alt="32px icon"
          />
          <img
            src="png/nx-icon-dark-48.png"
            width="48"
            height="48"
            alt="48px icon"
          />
        </p>
      </article>
    </div>
    <p>
      <a href="BRAND-GUIDELINES.txt">Brand guidelines</a> ·
      <a href="READ-ME.txt">Asset guide</a> ·
      <a href="source/mark.svg">Vector master</a>
    </p>
  </main>
</html>
