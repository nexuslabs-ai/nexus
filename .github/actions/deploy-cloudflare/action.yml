name: 'Deploy to Cloudflare'
description: 'Downloads a built site artifact, stamps version.txt into it, deploys it with the pinned workspace wrangler, and waits until the edge serves the new commit.'

inputs:
  artifact:
    description: 'Name of the workflow artifact holding the built site.'
    required: true
  config:
    description: 'Path to the wrangler.jsonc of the Worker to deploy, relative to the repository root.'
    required: true
  assets-dir:
    description: 'The assets directory named in that wrangler.jsonc, relative to the repository root. The artifact is downloaded here.'
    required: true
  host:
    description: 'Custom domain the Worker serves, used to verify the deploy.'
    required: true
  api-token:
    description: 'Cloudflare API token with Workers edit permission.'
    required: true
  account-id:
    description: 'Cloudflare account ID.'
    required: true

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Download site
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.artifact }}
        path: ${{ inputs.assets-dir }}

    - name: Stamp version
      shell: bash
      env:
        ASSETS_DIR: ${{ inputs.assets-dir }}
      run: printf '%s' "$GITHUB_SHA" > "$ASSETS_DIR/version.txt"

    - name: Deploy
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
        CONFIG: ${{ inputs.config }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        # wrangler truncates --message at byte 380 and rejects the deploy when
        # that byte lands mid-UTF-8 sequence, so pass only the subject line,
        # capped at 95 characters (95 x 4 bytes <= 380 under C.UTF-8).
        # https://github.com/cloudflare/workers-sdk/issues/11749
        subject="${COMMIT_MESSAGE%%$'\n'*}"
        subject="${subject%$'\r'}"
        subject="${subject:0:95}"
        pnpm exec wrangler deploy --config "$CONFIG" --message "${subject:-Deploy $GITHUB_SHA}"

    - name: Verify edge serves this commit
      shell: bash
      env:
        HOST: ${{ inputs.host }}
      run: |
        # version.txt is CDN-cached; a per-attempt query string plus no-cache
        # forces each request past the cache.
        for attempt in $(seq 1 15); do
          body=$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' \
            "https://$HOST/version.txt?cb=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" || true)
          if [ "$body" = "$GITHUB_SHA" ]; then
            echo "https://$HOST serves ${GITHUB_SHA::7} (attempt $attempt)"
            exit 0
          fi
          echo "Attempt $attempt: got '${body:-<no response>}', expected ${GITHUB_SHA::7}"
          sleep 5
        done
        echo "::error::https://$HOST did not serve ${GITHUB_SHA::7} within 15 attempts"
        exit 1
