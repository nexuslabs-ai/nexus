name: 'Deploy to Cloudflare'
description: 'Stamps version.txt into a built assets directory, deploys it with the pinned workspace wrangler, and waits until the edge serves the new commit. Expects pnpm and workspace dependencies to be installed by an earlier step.'

inputs:
  config:
    description: 'Path to the wrangler.jsonc of the Worker to deploy, relative to the repository root.'
    required: true
  assets-dir:
    description: 'The assets directory named in that wrangler.jsonc, relative to the repository root.'
    required: true
  host:
    description: 'Custom domain the Worker serves, used to verify the deploy.'
    required: true
  api-token:
    description: 'Cloudflare API token with Workers edit permission.'
    required: true
  account-id:
    description: 'Cloudflare account ID.'
    required: true

runs:
  using: composite
  steps:
    - name: Stamp version
      shell: bash
      env:
        ASSETS_DIR: ${{ inputs.assets-dir }}
      run: printf '%s' "$GITHUB_SHA" > "$ASSETS_DIR/version.txt"

    - name: Deploy
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
        CONFIG: ${{ inputs.config }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        # wrangler truncates --message at byte 380 and rejects the deploy when
        # that byte lands mid-UTF-8 sequence, so pass only the subject line.
        # https://github.com/cloudflare/workers-sdk/issues/11749
        subject="${COMMIT_MESSAGE%%$'\n'*}"
        subject="${subject%$'\r'}"
        pnpm exec wrangler deploy --config "$CONFIG" --message "${subject:-Deploy $GITHUB_SHA}"

    - name: Verify edge serves this commit
      shell: bash
      env:
        HOST: ${{ inputs.host }}
      run: |
        # version.txt is CDN-cached; a per-attempt query string plus no-cache
        # forces each request past the cache.
        for attempt in $(seq 1 15); do
          body=$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' \
            "https://$HOST/version.txt?cb=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" || true)
          if [ "$body" = "$GITHUB_SHA" ]; then
            echo "https://$HOST serves ${GITHUB_SHA::7} (attempt $attempt)"
            exit 0
          fi
          echo "Attempt $attempt: got '${body:-<no response>}', expected ${GITHUB_SHA::7}"
          sleep 5
        done
        echo "::error::https://$HOST did not serve ${GITHUB_SHA::7} within 15 attempts"
        exit 1
