name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Run on PRs targeting any branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Branch protection on `main` requires only the `CI Status` aggregator job
# (defined at the bottom of this file). Every other job runs on every push and
# pull request. Nothing is path-filtered and nothing is skippable, so the gate
# cannot go green on a change no job looked at.

jobs:
  # format-check and lint run full-tree to mirror local `pnpm lint` /
  # `pnpm format:check`.

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reads two manifests and needs no build, so it runs before the ESLint
      # cache restore — a lint failure must not hide a grammar skew.
      - name: Docs grammar pin
        run: pnpm --filter @nexus_ds/docs audit:grammar-pin

      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', 'packages/eslint-plugin-nexus/src/**') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', 'packages/eslint-plugin-nexus/src/**') }}-
            eslint-${{ runner.os }}-

      - name: Lint
        run: pnpm lint --cache --cache-location .eslintcache --cache-strategy content

  # ============================================
  # Build
  # ============================================

  audit-browser-support:
    name: Audit Browser Support
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit browser support floor
        run: pnpm audit:browser-support

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Audit turbo output declarations
        run: pnpm audit:turbo-outputs

      - name: Build all packages
        run: |
          set -euo pipefail
          pnpm turbo build
          node scripts/audit-turbo-outputs.js --post-build

      - name: Docs CSP inventory
        run: |
          pnpm turbo build --filter=@nexus_ds/docs
          pnpm --filter @nexus_ds/docs audit:csp

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: packages/**/dist
          retention-days: 1
          if-no-files-found: error

  # ============================================
  # TypeScript Check
  # ============================================

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages

      - name: Restore Turbo cache (read-only)
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: TypeScript check
        run: pnpm turbo typecheck

      - name: Core runtime export contract
        run: pnpm --filter @nexus_ds/core audit:runtime-exports

      - name: Core dist-type contract
        run: pnpm --filter @nexus_ds/core typecheck:dist

      - name: Tailwind and CSS export contract
        run: node scripts/typecheck-tailwind-dist.mjs

  # ============================================
  # React Package Jobs
  # ============================================

  # Fast-fail unit project; storybook project runs separately in test-react.
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate docs page manifest
        run: pnpm --filter @nexus_ds/docs generate:manifest

      - name: Check docs page manifest freshness
        # `git status --porcelain` (not `git diff`) so untracked new files also fail.
        run: |
          set -euo pipefail
          DIRTY=$(git status --porcelain -- apps/docs/app/_lib)
          if [ -n "$DIRTY" ]; then
            echo "::error::Docs page manifest is stale. Affected paths:"
            echo "$DIRTY"
            echo "::error::Run 'pnpm --filter @nexus_ds/docs generate:manifest' and commit the result."
            exit 1
          fi

      # `test:unit` is raw vitest, so nothing in it carries turbo's `^build`
      # edge. The props generator types `packages/react/src` against its
      # workspace dependencies' built declarations, and an unbuilt one
      # documents every prop reached through it as `any`. Running the task
      # rather than naming a package builds exactly what the generator
      # resolves, and keeps that set in the build graph instead of here.
      - name: Generate docs props JSON
        run: pnpm turbo generate:props --filter=@nexus_ds/docs

      - name: Run unit tests
        run: pnpm test:unit

  audit-tokens:
    name: Audit Tokens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run BEFORE the regen step so the build doesn't run on a broken
      # mode-file set. Validator is stdlib-only and runs in well under a
      # second — fail-fast for the cheapest possible signal.
      - name: Validate spacing mode files
        run: pnpm validate:spacing-modes

      # Guard against drift between the committed canonical-step-set.json
      # and the live union across spacing-*.json. Same fail-fast tier as
      # the validator above — stdlib-only, sub-second.
      - name: Check canonical step set freshness
        run: pnpm --filter @nexus_ds/eslint-plugin refresh:canonical-set --check

      - name: Build @nexus_ds/core
        run: pnpm --filter @nexus_ds/core build

      - name: Regenerate token outputs (tailwind)
        id: regen
        run: |
          set -euo pipefail
          pnpm tokens:tailwind

      - name: Check token output freshness
        if: ${{ !cancelled() && steps.regen.conclusion == 'success' }}
        # `git status --porcelain` (not `git diff`) so untracked new files also fail.
        run: |
          set -euo pipefail
          DIRTY=$(git status --porcelain -- \
            packages/tailwind)
          if [ -n "$DIRTY" ]; then
            echo "::error::Token output is stale. Affected paths:"
            echo "$DIRTY"
            echo "::error::Run 'pnpm tokens:tailwind' and commit the result."
            exit 1
          fi

      - name: APCA contrast vitest sweep
        if: ${{ !cancelled() && steps.regen.conclusion == 'success' }}
        run: pnpm --filter @nexus_ds/core audit:contrast

      - name: Color-blind audit
        if: ${{ !cancelled() && steps.regen.conclusion == 'success' }}
        run: pnpm --filter @nexus_ds/core audit:colorblind

      - name: Tailwind class-ref audit
        if: ${{ !cancelled() && steps.regen.conclusion == 'success' }}
        run: pnpm --filter @nexus_ds/core audit:class-refs

      - name: Token-mode codename audit
        if: ${{ !cancelled() && steps.regen.conclusion == 'success' }}
        run: pnpm audit:mode-codenames

      - name: Token-mode distinctness audit
        if: ${{ !cancelled() && steps.regen.conclusion == 'success' }}
        run: pnpm audit:mode-distinctness

  test-react:
    name: Test (React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The AdjustContrast story imports @nexus_ds/core, which is consumed via
      # its built dist/runtime entry (package.json exports). Build it so
      # Storybook/Vite can resolve the package during the story tests.
      - name: Build @nexus_ds/core
        run: pnpm --filter @nexus_ds/core build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright system deps
        # apt-installed deps aren't part of the browser cache; always install.
        run: npx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run story tests
        run: pnpm test:storybook

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Storybook
        uses: ./.github/actions/build-storybook

      - name: Upload Storybook build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/react/storybook-static
          retention-days: 7

  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages

      - name: Check bundle size
        run: pnpm size-limit

  # ============================================
  # Aggregator — the single required status check
  # ============================================
  # Runs unconditionally so a status always lands for branch protection. No
  # upstream job is gated, so none can skip; only `failure` and `cancelled`
  # propagate.
  #
  # Contract: every required job must appear in `needs:` below — otherwise its
  # failure won't propagate through the aggregator.
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    if: always()
    needs:
      - format-check
      - lint
      - audit-browser-support
      - build
      - typecheck
      - test-unit
      - audit-tokens
      - test-react
      - build-storybook
      - bundle-size
    steps:
      - name: Fail on any required-job failure or cancellation
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::One or more required jobs failed or were cancelled."
          exit 1
