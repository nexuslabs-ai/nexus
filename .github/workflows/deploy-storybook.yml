name: Deploy Storybook

# Publishes the static Storybook build to https://storybook.nexusui.so on
# Cloudflare Workers static assets. Standalone from ci.yml: this is a
# post-merge push:main workflow, not a PR check, so it is not part of the
# `CI Status` branch-protection aggregator. ci.yml still builds Storybook on
# PRs, which is where a broken build is caught.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.npmrc'
      - '.nvmrc'
      - '.github/actions/build-storybook/**'
      - '.github/actions/deploy-cloudflare/**'
      - '.github/workflows/deploy-storybook.yml'
  workflow_dispatch:

concurrency:
  group: deploy-storybook
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    # workflow_dispatch accepts any ref; the published site only ever tracks main.
    if: github.ref == 'refs/heads/main'
    environment:
      name: storybook
      url: https://storybook.nexusui.so
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build Storybook
        uses: ./.github/actions/build-storybook

      - name: Deploy
        uses: ./.github/actions/deploy-cloudflare
        with:
          config: packages/react/wrangler.jsonc
          assets-dir: packages/react/storybook-static
          host: storybook.nexusui.so
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
